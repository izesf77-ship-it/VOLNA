name: VOLNA
options:
  bundleIdPrefix: com.volna
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  VOLNA:
    type: application
    platform: iOS
    sources:
      - path: VOLNA
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volna.app
        PRODUCT_NAME: VOLNA
        INFOPLIST_FILE: VOLNA/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  VOLNATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VOLNATests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: VOLNA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volna.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VOLNA.app/VOLNA"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  VOLNA:
    build:
      targets:
        VOLNA: all
        VOLNATests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VOLNATests
    archive:
      config: Release
