name: VOLNA
options:
  bundleIdPrefix: com.volna
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: ru
  defaultConfig: Debug
  
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for now
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

configs:
  Debug: debug
  Release: release

targets:
  VOLNA:
    type: application
    platform: iOS
    sources:
      - path: VOLNA
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volna.app
        INFOPLIST_FILE: VOLNA/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # User will fill this
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: AudioStreaming
    scheme:
      testTargets:
        - VOLNATests
      
  VOLNATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VOLNATests
    dependencies:
      - target: VOLNA

packages:
  AudioStreaming:
    url: https://github.com/dimitris-c/AudioStreaming
    from: "1.0.0"

schemes:
  VOLNA:
    build:
      targets:
        VOLNA: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VOLNATests
    archive:
      config: Release
