name: Build and Test

on:
  push:
    branches:
      - master
      - feature/open-music-catalog
  pull_request:
    branches:
      - master
      - feature/open-music-catalog
  workflow_dispatch:

jobs:
  build:
    name: Build and test on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          for name in "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15" "iPhone 14 Pro" "iPhone 14"; do
            if xcrun simctl list devices available | grep -Fq "$name ("; then
              echo "name=$name" >> "$GITHUB_OUTPUT"
              echo "Selected simulator: $name"
              exit 0
            fi
          done
          # Новые версии Xcode могут содержать только свежую линейку iPhone.
          # Берём первый доступный iPhone, а не падаем на устаревшем списке.
          FALLBACK="$(xcrun simctl list devices available | sed -nE 's/^[[:space:]]+(iPhone[^(]*) \([0-9A-Fa-f-]+\).*/\1/p' | head -1 | xargs)"
          if [ -n "$FALLBACK" ]; then
            echo "name=$FALLBACK" >> "$GITHUB_OUTPUT"
            echo "Selected fallback simulator: $FALLBACK"
            exit 0
          fi
          echo "No iPhone simulator found"
          xcrun simctl list devices available
          exit 1

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7
