name: Build and Test

on:
  push:
    branches:
      - master
      - feature/open-music-catalog
  pull_request:
    branches:
      - master
      - feature/open-music-catalog
  workflow_dispatch:

jobs:
  build:
    name: Build and test on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      BUILD_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            BUILD_SHA="$BUILD_SHA" \
            build

      - name: Verify build identity
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'VOLNA.app' -print -quit)"
          test -n "$APP_PATH"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          echo "Build: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          echo "Git SHA: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleBuildSHA' "$APP_PATH/Info.plist")"

      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          for name in "iPhone 15 Pro" "iPhone 15" "iPhone 16 Pro" "iPhone 16" "iPhone 14 Pro" "iPhone 14"; do
            if xcrun simctl list devices available | grep -Fq "$name ("; then
              echo "name=$name" >> "$GITHUB_OUTPUT"
              echo "Selected simulator: $name"
              exit 0
            fi
          done
          # Новые версии Xcode могут содержать только свежую линейку iPhone.
          # Берём первый доступный iPhone, а не падаем на устаревшем списке.
          FALLBACK="$(xcrun simctl list devices available | sed -nE 's/^[[:space:]]+(iPhone[^(]*) \([0-9A-Fa-f-]+\).*/\1/p' | head -1 | xargs)"
          if [ -n "$FALLBACK" ]; then
            echo "name=$FALLBACK" >> "$GITHUB_OUTPUT"
            echo "Selected fallback simulator: $FALLBACK"
            exit 0
          fi
          echo "No iPhone simulator found"
          xcrun simctl list devices available
          exit 1

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            BUILD_SHA="$BUILD_SHA" \
            test

      - name: Capture simulator screenshots
        id: screenshots
        continue-on-error: true
        run: |
          set -euo pipefail
          SIM_NAME="${{ steps.simulator.outputs.name }}"
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'VOLNA.app' -print -quit)"
          test -n "$APP_PATH"

          xcrun simctl boot "$SIM_NAME" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_NAME" -b
          xcrun simctl uninstall "$SIM_NAME" com.volna.app 2>/dev/null || true
          xcrun simctl install "$SIM_NAME" "$APP_PATH"

          mkdir -p artifacts/screenshots
          CONTAINER="$(xcrun simctl get_app_container "$SIM_NAME" com.volna.app data)"
          READY_DIR="$CONTAINER/Documents/VOLNA"

          capture() {
            local marker="$1"
            local output="$2"
            shift 2

            xcrun simctl terminate "$SIM_NAME" com.volna.app 2>/dev/null || true
            rm -f "$READY_DIR/$marker"
            xcrun simctl launch "$SIM_NAME" com.volna.app \
              -uiScreenshotReadyFile "$marker" "$@"

            for _ in $(seq 1 120); do
              if [ -f "$READY_DIR/$marker" ]; then
                break
              fi
              sleep 1
            done
            if [ ! -f "$READY_DIR/$marker" ]; then
              echo "::warning::Маркер готовности $marker не появился за 120 секунд"
            fi

            # Даём AsyncImage загрузить обложки и завершиться анимации.
            sleep 3
            xcrun simctl io "$SIM_NAME" screenshot "artifacts/screenshots/$output"
          }

          capture home-empty.ready 01-home-empty.png -uiScreenshotTab home
          capture home-playing.ready 02-home-playing.png -uiScreenshotMiniPlayer
          capture search.ready 03-search.png -uiScreenshotTab search
          capture library.ready 04-library.png -uiScreenshotTab library
          capture player.ready 05-player.png -uiScreenshotPlayer
          capture search-keyboard.ready 06-search-keyboard.png -uiScreenshotTab search -uiScreenshotKeyboard
          capture home-scroll.ready 07-home-scroll.png -uiScreenshotTab home -uiScreenshotScroll
          capture build-info.ready 08-build-info.png -uiScreenshotTab home -uiScreenshotSettings

          ls -lh artifacts/screenshots

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots-${{ github.sha }}
          path: artifacts/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7
