name: Build, Test and IPA

on:
  push:
    branches:
      - master
      - feature/open-music-catalog
  pull_request:
    branches:
      - master
      - feature/open-music-catalog
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test on iOS Simulator
    runs-on: xcode-27
    timeout-minutes: 40

    env:
      BUILD_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode, iOS SDK and Swift versions
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version
          XCODE_VERSION="$(xcodebuild -version | awk '/Xcode/ {print $2; exit}')"
          echo "Detected Xcode version: ${XCODE_VERSION}"
          if [[ "${XCODE_VERSION}" != 27* ]]; then
            echo "::error::Ожидается Xcode 27.x, но обнаружен ${XCODE_VERSION}"
            exit 1
          fi
          xcrun simctl list devices available | head -n 40 || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            BUILD_SHA="$BUILD_SHA" \
            build

      - name: Verify build identity
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'VOLNA.app' -print -quit)"
          test -n "$APP_PATH"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          echo "Build: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          echo "Git SHA: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleBuildSHA' "$APP_PATH/Info.plist")"

      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          # Xcode 27 simulators: iPhone 17, 17e, 18 Pro, 18 Pro Max, iPhone Air, iPhone Duo
          for name in "iPhone 18 Pro" "iPhone 17" "iPhone 18 Pro Max" "iPhone 17e" "iPhone Air" "iPhone Duo"; do
            if xcrun simctl list devices available | grep -Fq "$name ("; then
              echo "name=$name" >> "$GITHUB_OUTPUT"
              echo "Selected simulator: $name"
              exit 0
            fi
          done
          # Fallback: find any available iPhone simulator
          FALLBACK="$(xcrun simctl list devices available | sed -nE 's/^[[:space:]]+(iPhone[^(]*) \([0-9A-Fa-f-]+\).*/\1/p' | head -1 | xargs)"
          if [ -n "$FALLBACK" ]; then
            echo "name=$FALLBACK" >> "$GITHUB_OUTPUT"
            echo "Selected fallback simulator: $FALLBACK"
            exit 0
          fi
          echo "::error::No iPhone simulator found"
          xcrun simctl list devices available
          exit 1

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            BUILD_SHA="$BUILD_SHA" \
            test

      - name: Capture simulator screenshots
        id: screenshots
        continue-on-error: true
        run: |
          set -euo pipefail
          SIM_NAME="${{ steps.simulator.outputs.name }}"
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'VOLNA.app' -print -quit)"
          test -n "$APP_PATH"

          xcrun simctl boot "$SIM_NAME" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_NAME" -b
          xcrun simctl uninstall "$SIM_NAME" com.volna.app 2>/dev/null || true
          xcrun simctl install "$SIM_NAME" "$APP_PATH"

          mkdir -p artifacts/screenshots
          CONTAINER="$(xcrun simctl get_app_container "$SIM_NAME" com.volna.app data)"
          READY_DIR="$CONTAINER/Documents/VOLNA"

          capture() {
            local marker="$1"
            local output="$2"
            shift 2

            xcrun simctl terminate "$SIM_NAME" com.volna.app 2>/dev/null || true
            rm -f "$READY_DIR/$marker"
            xcrun simctl launch "$SIM_NAME" com.volna.app \
              -uiScreenshotReadyFile "$marker" "$@"

            for _ in $(seq 1 120); do
              if [ -f "$READY_DIR/$marker" ]; then
                break
              fi
              sleep 1
            done
            if [ ! -f "$READY_DIR/$marker" ]; then
              echo "::warning::Маркер готовности $marker не появился за 120 секунд"
            fi

            # Даём AsyncImage загрузить обложки и завершиться анимации.
            sleep 3
            xcrun simctl io "$SIM_NAME" screenshot "artifacts/screenshots/$output"
          }

          capture home-empty.ready 01-home-empty.png -uiScreenshotTab home
          capture home-playing.ready 02-home-playing.png -uiScreenshotMiniPlayer
          capture search.ready 03-search.png -uiScreenshotTab search
          capture library.ready 04-library.png -uiScreenshotTab library
          capture player.ready 05-player.png -uiScreenshotPlayer
          capture search-keyboard.ready 06-search-keyboard.png -uiScreenshotTab search -uiScreenshotKeyboard
          capture home-scroll.ready 07-home-scroll.png -uiScreenshotTab home -uiScreenshotScroll
          capture build-info.ready 08-build-info.png -uiScreenshotTab home -uiScreenshotSettings
          capture radio.ready 09-radio.png -uiScreenshotTab radio

          ls -lh artifacts/screenshots

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots-${{ github.sha }}
          path: artifacts/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7

  build-unsigned-ipa:
    name: Build unsigned IPA for sideloading
    runs-on: xcode-27
    needs: build-and-test
    timeout-minutes: 45

    env:
      BUILD_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode, iOS SDK and Swift versions
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version
          XCODE_VERSION="$(xcodebuild -version | awk '/Xcode/ {print $2; exit}')"
          echo "Detected Xcode version: ${XCODE_VERSION}"
          if [[ "${XCODE_VERSION}" != 27* ]]; then
            echo "::error::Ожидается Xcode 27.x, но обнаружен ${XCODE_VERSION}"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and archive without code signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VOLNA.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            BUILD_SHA="$BUILD_SHA" \
            archive

      - name: Verify archive was created
        run: |
          set -euo pipefail
          test -d build/VOLNA.xcarchive
          test -d build/VOLNA.xcarchive/Products
          test -d build/VOLNA.xcarchive/Products/Applications
          APP_PATH="build/VOLNA.xcarchive/Products/Applications/VOLNA.app"
          test -d "$APP_PATH"
          echo "Archive structure verified"
          ls -lh build/VOLNA.xcarchive/Products/Applications/
          
      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          
          # Create Payload directory structure
          mkdir -p build/ipa/Payload
          
          # Copy the .app bundle
          APP_PATH="build/VOLNA.xcarchive/Products/Applications/VOLNA.app"
          cp -R "$APP_PATH" build/ipa/Payload/VOLNA.app
          
          # Create IPA (ZIP archive with .ipa extension)
          cd build/ipa
          zip -r -q ../../VOLNA-unsigned.ipa Payload
          cd ../..
          
          # Verify IPA was created
          test -f VOLNA-unsigned.ipa
          IPA_SIZE=$(stat -f%z VOLNA-unsigned.ipa 2>/dev/null || stat -c%s VOLNA-unsigned.ipa 2>/dev/null || wc -c < VOLNA-unsigned.ipa)
          
          echo "ipa_path=VOLNA-unsigned.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"
          
          echo "Unsigned IPA created: VOLNA-unsigned.ipa ($IPA_SIZE bytes)"
          ls -lh VOLNA-unsigned.ipa

      - name: Verify IPA structure
        run: |
          set -euo pipefail
          
          echo "=== IPA Contents ==="
          unzip -l VOLNA-unsigned.ipa | head -30
          
          echo ""
          echo "=== Verifying IPA Structure ==="
          
          # Extract IPA to temp directory for validation
          mkdir -p build/verify
          unzip -q VOLNA-unsigned.ipa -d build/verify
          
          # Check required structure
          test -d build/verify/Payload
          test -d build/verify/Payload/VOLNA.app
          test -f build/verify/Payload/VOLNA.app/Info.plist
          test -f build/verify/Payload/VOLNA.app/VOLNA
          
          # Read and display bundle information
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/verify/Payload/VOLNA.app/Info.plist)
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/verify/Payload/VOLNA.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/verify/Payload/VOLNA.app/Info.plist)
          BUILD_SHA=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleBuildSHA' build/verify/Payload/VOLNA.app/Info.plist)
          
          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Git SHA: $BUILD_SHA"
          
          # Verify Bundle ID is correct
          if [ "$BUNDLE_ID" != "com.volna.app" ]; then
            echo "::error::Bundle ID is incorrect: expected com.volna.app, got $BUNDLE_ID"
            exit 1
          fi
          
          # Check executable is not empty
          EXEC_SIZE=$(stat -f%z build/verify/Payload/VOLNA.app/VOLNA 2>/dev/null || stat -c%s build/verify/Payload/VOLNA.app/VOLNA 2>/dev/null)
          if [ "$EXEC_SIZE" -lt 1000 ]; then
            echo "::error::Executable file is too small: $EXEC_SIZE bytes"
            exit 1
          fi
          echo "Executable size: $EXEC_SIZE bytes"
          
          # List Frameworks (if any)
          if [ -d build/verify/Payload/VOLNA.app/Frameworks ]; then
            echo ""
            echo "=== Embedded Frameworks ==="
            ls -lh build/verify/Payload/VOLNA.app/Frameworks/
          else
            echo "No embedded frameworks (expected for this app)"
          fi
          
          echo ""
          echo "✅ IPA structure verification passed"

      - name: Calculate IPA checksum
        id: checksum
        run: |
          set -euo pipefail
          SHA256=$(shasum -a 256 VOLNA-unsigned.ipa | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA256"

      - name: Create build summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ✅ Unsigned IPA Build Complete
          
          ### Build Information
          - **Commit**: \`${{ github.sha }}\`
          - **Build Number**: \`${{ github.run_id }}\`
          - **Bundle ID**: \`com.volna.app\`
          - **Version**: \`1.0.0\`
          
          ### IPA Details
          - **File**: \`VOLNA-unsigned.ipa\`
          - **Size**: \`${{ steps.package.outputs.ipa_size }}\` bytes
          - **SHA-256**: \`${{ steps.checksum.outputs.sha256 }}\`
          
          ### ⚠️ Important Notes
          - This is an **unsigned IPA** for sideloading
          - Cannot be installed directly on iPhone
          - Requires signing via [Sideloadly](https://sideloadly.io/), [AltStore](https://altstore.io/), or similar tools
          - Intended for development and testing purposes
          
          ### Next Steps
          1. Download the artifact: \`VOLNA-unsigned-IPA\`
          2. Sign with your Apple Developer account or free account
          3. Install on device via sideloading tool
          EOF

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOLNA-unsigned-IPA
          path: VOLNA-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-build-logs-${{ github.sha }}
          path: |
            build/DerivedData/Logs
            build/ipa
          if-no-files-found: ignore
          retention-days: 7
