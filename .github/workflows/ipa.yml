name: Build IPA

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Archive and export IPA
    runs-on: macos-latest
    timeout-minutes: 50

    env:
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.DEVELOPMENT_TEAM != '' }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate and provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm certificate.p12

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/volna.mobileprovision"

      - name: Archive unsigned app
        if: env.HAS_SIGNING != 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VOLNA-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            BUILD_SHA="$BUILD_SHA"

      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/unsigned/Payload
          cp -R build/VOLNA-unsigned.xcarchive/Products/Applications/VOLNA.app build/unsigned/Payload/
          SHORT_SHA="${BUILD_SHA:0:7}"
          cd build/unsigned
          zip -qry "../VOLNA-unsigned-${SHORT_SHA}.ipa" Payload
          cd ../..
          ls -lh build/VOLNA-unsigned-${SHORT_SHA}.ipa

      - name: Archive signed app
        if: env.HAS_SIGNING == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VOLNA.xcodeproj \
            -scheme VOLNA \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VOLNA.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            -allowProvisioningUpdates

      - name: Export signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/VOLNA.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates

          SIGNED_IPA="$(ls build/export/*.ipa | head -1)"
          test -n "$SIGNED_IPA"
          SHORT_SHA="${BUILD_SHA:0:7}"
          cp "$SIGNED_IPA" "build/VOLNA-signed-${SHORT_SHA}.ipa"
          ls -lh "build/VOLNA-signed-${SHORT_SHA}.ipa"

      - name: Verify IPA contents and identity
        run: |
          set -euo pipefail
          shopt -s nullglob
          IPAS=(build/*.ipa)
          test ${#IPAS[@]} -gt 0
          for IPA in "${IPAS[@]}"; do
            echo "=== $IPA ==="
            unzip -l "$IPA" | head -30
            rm -rf build/ipa-check
            mkdir -p build/ipa-check
            unzip -q "$IPA" -d build/ipa-check
            APP_PATH="$(find build/ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$APP_PATH"
            echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
            echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
            echo "Build: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
            echo "Git SHA: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleBuildSHA' "$APP_PATH/Info.plist")"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleBuildSHA' "$APP_PATH/Info.plist")" = "$BUILD_SHA"
          done
          echo "Expected SHA: $BUILD_SHA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOLNA-IPA-${{ github.sha }}
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipa
          generate_release_notes: true
          body: |
            ## VOLNA ${{ github.ref_name }}

            Нативный iPhone-плеер открытой музыки.

            **Файлы:**
            - `VOLNA-unsigned.ipa` — неподписанная сборка. Не устанавливается двойным щелчком и не предназначена для App Store. Для установки требуется собственная подпись (например, AltStore, Sideloadly или Xcode) и ваша учётная запись Apple.
            - `VOLNA-signed.ipa` — появляется только если в репозитории настроены сертификат, provisioning profile и DEVELOPMENT_TEAM.

            Сборка создана GitHub Actions на macOS. Проверка на физическом iPhone не выполнялась, если об этом не указано отдельно.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
